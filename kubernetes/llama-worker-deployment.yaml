apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-worker
  labels:
    app: llama-worker
    component: summarization
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llama-worker
  template:
    metadata:
      labels:
        app: llama-worker
        component: summarization
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: llama-worker
          image: innovexa/llama-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: LLAMA_MODEL_PATH
              value: "/models/llama-2-7b-chat.Q4_K_M.gguf"
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: models
              mountPath: /models
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llama-worker
spec:
  selector:
    app: llama-worker
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llama-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: External
      external:
        metric:
          name: redis_queue_depth
          selector:
            matchLabels:
              queue: summarization
        target:
          type: AverageValue
          averageValue: "3"  # Scale up when >3 jobs per worker
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max