# ==============================================================================
# LiveKit Egress Service Production Configuration
# Innovexa Native Meeting Recording Worker
# ==============================================================================

# LiveKit Connection Settings
api_key: "${LIVEKIT_API_KEY}"
api_secret: "${LIVEKIT_API_SECRET}"
ws_url: "${LIVEKIT_WS_URL}"

# Redis Queue & State Coordinator
redis:
  address: "${REDIS_HOST:-redis}:6379"
  username: "${REDIS_USERNAME:-}"
  password: "${REDIS_PASSWORD:-}"
  db: 0

# Health Check & Telemetry
health_port: 8080
prometheus_port: 9090
log_level: info

# Headless Chrome Media & Security Flags
# Ensures zero-prompt microphone/camera access, sandbox bypass in Docker, and autoplay enablement
custom_chrome_flags:
  - "--use-fake-ui-for-media-stream"
  - "--autoplay-policy=no-user-gesture-required"
  - "--allow-file-access-from-files"
  - "--disable-web-security"
  - "--no-sandbox"
  - "--disable-setuid-sandbox"
  - "--disable-gpu"
  - "--disable-dev-shm-usage"
  - "--disable-accelerated-2d-canvas"
  - "--no-first-run"
  - "--no-default-browser-check"

# Default Recording Output Formats
defaults:
  room_composite:
    file_type: "mp4"
    filepath: "/home/egress/recordings/{room_name}-{time}.mp4"
    audio_only: false
    custom_base_url: ""

# S3 / Object Storage Upload Destination (Optional Egress Auto-Sync)
s3:
  access_key: "${AWS_ACCESS_KEY_ID:-}"
  secret: "${AWS_SECRET_ACCESS_KEY:-}"
  region: "${AWS_REGION:-us-east-1}"
  bucket: "${S3_BUCKET:-innovexa-meeting-recordings}"
  endpoint: "${S3_ENDPOINT:-}"
  force_path_style: false
